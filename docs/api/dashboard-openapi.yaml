openapi: 3.0.3
info:
  title: Polymarket Trader Operator API
  version: 0.2.0
  description: Operator and dashboard endpoints exposed by pt-dashboard.
  title: Coinbase Workstation Operator API
  version: 0.3.0
  description: Legacy operator endpoints plus Coinbase-native workstation APIs exposed by pt-dashboard.
servers:
  - url: http://127.0.0.1:8080
paths:
  /health:
    get:
      summary: Health and kill-switch status
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /healthz:
    get:
      summary: Liveness probe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /ready:
    get:
      summary: Readiness probe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /metrics:
    get:
      summary: Prometheus metrics
      responses:
        '200':
          description: Prometheus exposition format
          content:
            text/plain:
              schema:
                type: string
  /state/risk:
    get:
      summary: Current risk state
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskState'
  /state/books:
    get:
      summary: Latest market snapshots
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MarketSnapshot'
  /state/markets:
    get:
      summary: Market summary rows for legacy UI selector
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MarketView'
  /state/history:
    get:
      summary: Rolling history points for a selected market
      parameters:
        - in: query
          name: market_id
          required: false
          schema:
            type: string
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 10
            maximum: 1200
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketHistoryResponse'
  /state/executions:
    get:
      summary: Recent execution reports
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExecutionReport'
  /state/execution/orders:
    get:
      summary: Execution lifecycle events
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExecutionEvent'
  /state/execution/costs:
    get:
      summary: Execution cost attribution rows
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExecutionCostAttribution'
  /state/execution/vectors:
    get:
      summary: Current execution vector policy
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionVectors'
  /state/bias:
    get:
      summary: Current fused asset bias
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BiasView'
  /state/inventory:
    get:
      summary: Inventory notional
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryView'
  /state/coinbase/wallet:
    get:
      summary: Coinbase wallet balances
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WalletBalance'
  /state/coinbase/allocations:
    get:
      summary: Allocation drift rows
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AllocationDrift'
  /state/coinbase/rebalance-plan:
    get:
      summary: Current rebalance plan and approval metadata
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RebalancePlanView'
  /state/coinbase/orders:
    get:
      summary: Current Coinbase open orders snapshot
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CoinbaseOrderSummary'
  /state/coinbase/orderbook:
    get:
      summary: Coinbase L2 in-memory orderbook snapshots
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CoinbaseOrderBookState'
  /state/coinbase/auth:
    get:
      summary: Coinbase auth profile status (redacted)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoinbaseAuthStatus'
  /state/routes/opportunities:
    get:
      summary: Ranked conversion/route opportunities
      parameters:
        - in: query
          name: venue_set
          required: false
          schema:
            type: string
          description: Comma-separated venue filter, e.g. `coinbase,kraken,gemini`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RouteOpportunity'
  /state/routes/executions:
    get:
      summary: Route execution plans (approved or assist-mode candidates)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RouteExecutionPlan'
  /state/fees/summary:
    get:
      summary: Current Coinbase fee tier summary
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoinbaseTransactionSummary'
  /state/listings/candidates:
    get:
      summary: Auto-discovered recently listed market candidates
      parameters:
        - in: query
          name: window
          required: false
          schema:
            type: string
        - in: query
          name: granularity_sec
          required: false
          schema:
            type: integer
        - in: query
          name: max_scan
          required: false
          schema:
            type: integer
        - in: query
          name: max_results
          required: false
          schema:
            type: integer
        - in: query
          name: min_candles
          required: false
          schema:
            type: integer
        - in: query
          name: min_gap_candles
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingCandidatesResponse'
  /state/listings/overlay:
    post:
      summary: Overlay and normalize listing cohorts for visual comparison
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListingOverlayRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingOverlayResponse'
  /state/listings/l2-archive:
    get:
      summary: In-memory Coinbase L2 archive summary for listing analysis
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/L2ArchiveResponse'
  /state/feed/health:
    get:
      summary: Coinbase feed integrity and lifecycle counters
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedHealthResponse'
  /state/feed/diagnostics:
    get:
      summary: Detailed Coinbase feed diagnostics and rolling reject/cancel rates
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedDiagnosticsResponse'
  /state/parity/monitor:
    get:
      summary: Route parity monitor with strategy gate pass/fail reasons
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParityMonitorResponse'
  /state/parity/export-csv:
    post:
      summary: Export parity monitor rows to server-side CSV artifact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParityCsvExportRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParityCsvExportResponse'
  /state/venues/latency:
    get:
      summary: Venue lifecycle latency percentiles derived from execution events
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VenueLatencyStats'
  /state/venues/capabilities:
    get:
      summary: Venue capability registry used by execution policy branching
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VenueCapability'
  /state/venues/fill-quality:
    get:
      summary: Venue fill and reject quality rollups
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VenueFillQualityStats'
  /state/venues/rejects:
    get:
      summary: Alias of venue fill-quality focused on reject/cancel stats
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VenueFillQualityStats'
  /state/routes/export-csv:
    post:
      summary: Export route opportunities to server-side CSV artifact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteCsvExportRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteCsvExportResponse'
  /state/wallet-intel/coinbase:
    get:
      summary: Wallet intel snapshots from authenticated Coinbase balances/drifts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WalletIntelSnapshot'
  /state/wallet-intel/polymarket:
    get:
      summary: Wallet intel snapshots derived from Polymarket universe and fused bias
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WalletIntelSnapshot'
  /state/wallet-intel/leaderboard:
    get:
      summary: Wallet/route leaderboard-style snapshots for ranking and drift checks
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WalletIntelSnapshot'
  /state/wallet-intel/export-csv:
    post:
      summary: Export wallet intel snapshots to server-side CSV artifact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletIntelExportRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletIntelExportResponse'
  /ops/halt:
    post:
      summary: Set manual halt
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /ops/resume:
    post:
      summary: Resume running mode
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /ops/flatten:
    post:
      summary: Enter safe mode / flatten behavior
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /ops/profile/pilot-ultra-tight:
    post:
      summary: Apply pilot ultra-tight execution profile
  /api/v1/products:
    get:
      summary: Coinbase product catalog in scope for the workstation
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkstationProduct'
  /api/v1/scanner:
    get:
      summary: Ranked scanner output across Coinbase products
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScannerRow'
  /api/v1/products/{product_id}:
    get:
      summary: Detailed view for a specific Coinbase product
      parameters:
        - in: path
          name: product_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetailView'
  /api/v1/listings:
    get:
      summary: Ranked Listing Radar rows for Coinbase-first research and pre-launch preparation
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ListingRadarRow'
  /api/v1/listings/{product_id}:
    get:
      summary: Detailed Listing Radar view for a product
      parameters:
        - in: path
          name: product_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /ops/coinbase/rebalance/approve:
    post:
      summary: Approve current rebalance plan with approval token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RebalanceApprovalRequest'
                $ref: '#/components/schemas/ListingRadarDetailView'
  /api/v1/risk/overview:
    get:
      summary: Risk Cockpit summary for the current workstation posture
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskOverviewView'
  /api/v1/agent/console:
    get:
      summary: Agent Console posture, approvals, and next action summary
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentConsoleView'
  /api/v1/orders:
    get:
      summary: Manual and automatic workstation orders
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkstationOrder'
    post:
      summary: Queue a manual workstation order
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkstationOrder'
  /api/v1/approval-queue:
    get:
      summary: Read-only operator review queue derived from current workstation orders
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApprovalQueueItem'
  /api/v1/strategies:
    get:
      summary: Strategy config, imports, and live-arm state
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RebalanceApprovalResponse'
  /ops/coinbase/rebalance/reject:
    post:
      summary: Reject current rebalance plan
                $ref: '#/components/schemas/StrategiesResponse'
  /api/v1/mode:
    post:
      summary: Change workstation mode
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RebalanceApprovalResponse'
  /ops/coinbase/auth/reload:
    post:
      summary: Reload active Coinbase auth profile
                $ref: '#/components/schemas/ModeResponse'
  /api/v1/live/arm:
    post:
      summary: Arm live routing
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthReloadResult'
  /ops/coinbase/auth/switch-profile:
    post:
      summary: Switch Coinbase auth profile and reload credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoinbaseAuthSwitchRequest'
                $ref: '#/components/schemas/ModeResponse'
  /api/v1/live/disarm:
    post:
      summary: Disarm live routing
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthReloadResult'
  /ops/execution/unwind:
    post:
      summary: Guarded emergency unwind trigger
                $ref: '#/components/schemas/ModeResponse'
  /api/v1/orders/{order_id}/cancel:
    post:
      summary: Request cancellation for a queued or open order
      parameters:
        - in: path
          name: order_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /ops/unwind/now:
    post:
      summary: Alias for guarded emergency unwind trigger
                $ref: '#/components/schemas/ActionResponse'
  /api/v1/strategy-lab/import:
    post:
      summary: Import a strategy-lab JSON output
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
                $ref: '#/components/schemas/StrategyLabImportSummary'
components:
  schemas:
    Health:
      type: object
      required: [status, kill_switch]
      properties:
        status: { type: string }
        kill_switch: { type: string }
    RiskState:
      type: object
      required: [killswitch, daily_pnl, max_daily_loss, open_notional, unhedged_delta, open_markets, stale_books, last_update_ms]
      properties:
        killswitch: { type: string }
        daily_pnl: { type: number }
        max_daily_loss: { type: number }
        open_notional: { type: number }
        unhedged_delta: { type: number }
        open_markets: { type: integer }
        stale_books: { type: integer }
        last_update_ms: { type: integer }
    MarketSnapshot:
      type: object
      required: [market_id, token_id, bid, ask, spread, liquidity, ts]
      properties:
        market_id: { type: string }
      
        token_id: { type: string }
        bid: { type: number }
        ask: { type: number }
        spread: { type: number }
        liquidity: { type: number }
        ts:
          type: string
          format: date-time
    MarketView:
      type: object
      required: [market_id, token_id, bid, ask, spread, mid, ts]
      properties:
        market_id: { type: string }
        token_id: { type: string }
        bid: { type: number }
        ask: { type: number }
        spread: { type: number }
        mid: { type: number }
        ts:
          type: string
          format: date-time
    MarketHistoryPoint:
      type: object
      required: [market_id, mid, spread, bid, ask, ts]
      properties:
        market_id: { type: string }
        mid: { type: number }
        spread: { type: number }
        bid: { type: number }
        ask: { type: number }
        ts:
          type: string
          format: date-time
    MarketHistoryResponse:
      type: object
      required: [points]
      properties:
        market_id:
          type: string
          nullable: true
        points:
          type: array
          items:
            $ref: '#/components/schemas/MarketHistoryPoint'
    ExecutionReport:
      type: object
      required: [venue, order_id, status, side, filled_qty, avg_px, ts]
      properties:
        venue: { type: string }
        order_id: { type: string }
        market_id:
          type: string
          nullable: true
        status: { type: string }
        side: { type: string }
        filled_qty: { type: number }
        avg_px: { type: number }
        ts:
          type: string
          format: date-time
        details:
          type: string
          nullable: true
    ExecutionEvent:
      type: object
      required: [order_id, venue, side, state, qty, price, ts]
      properties:
        order_id: { type: string }
        venue: { type: string }
        market_id:
          type: string
          nullable: true
        product_id:
          type: string
          nullable: true
        side: { type: string }
        state: { type: string }
        qty: { type: number }
        price: { type: number }
        ts:
          type: string
          format: date-time
        details:
          type: string
          nullable: true
        reason_code:
          type: string
          nullable: true
        unwind_flag:
          type: boolean
    ExecutionCostAttribution:
      type: object
      required: [execution_id, venue, side, qty, avg_px, reference_px, fee_bps, fee_est, slippage_bps, slippage_est, rebate_bps_est, rebate_est, effective_edge, ts]
      properties:
        execution_id: { type: string }
        venue: { type: string }
        market_id:
          type: string
          nullable: true
        side: { type: string }
        qty: { type: number }
        avg_px: { type: number }
        reference_px: { type: number }
        fee_bps: { type: number }
        fee_est: { type: number }
        slippage_bps: { type: number }
        slippage_est: { type: number }
        rebate_bps_est: { type: number }
        rebate_est: { type: number }
        effective_edge: { type: number }
        ts:
          type: string
          format: date-time
        strategy_class:
          type: string
          nullable: true
        route_id:
          type: string
          nullable: true
    ExecutionVectors:
      type: object
      required: [entry_max_slippage_bps, exit_max_slippage_bps, entry_offset_bps, exit_offset_bps, max_cross_bps_unwind]
      properties:
        entry_max_slippage_bps: { type: number }
        exit_max_slippage_bps: { type: number }
        entry_offset_bps: { type: number }
        exit_offset_bps: { type: number }
        max_cross_bps_unwind: { type: number }
    WalletBalance:
      type: object
      required: [venue, account_id, asset, available, hold, usd_value, ts]
      properties:
        venue: { type: string }
        account_id: { type: string }
        asset: { type: string }
        available: { type: number }
        hold: { type: number }
        usd_value: { type: number }
        ts:
          type: string
          format: date-time
    AllocationDrift:
      type: object
      required: [asset, current_weight, target_weight, drift_weight, current_usd, target_usd, drift_usd]
      properties:
        asset: { type: string }
        current_weight: { type: number }
        target_weight: { type: number }
        drift_weight: { type: number }
        current_usd: { type: number }
        target_usd: { type: number }
        drift_usd: { type: number }
    RebalancePlanView:
      type: object
      required: [plan_id, status, intent_count, total_drift_abs_usd, created_ts, expires_ts, approval_required]
      properties:
        plan_id: { type: string }
        status: { type: string }
        intent_count: { type: integer }
        total_drift_abs_usd: { type: number }
        created_ts:
          type: string
          format: date-time
        expires_ts:
          type: string
          format: date-time
        approval_token_id:
          type: string
          nullable: true
        approval_required: { type: boolean }
        approval_expires_ts:
          type: string
          nullable: true
          format: date-time
    RebalanceApprovalRequest:
      type: object
      required: [token_id]
      properties:
        token_id: { type: string }
    RebalanceApprovalResponse:
      type: object
