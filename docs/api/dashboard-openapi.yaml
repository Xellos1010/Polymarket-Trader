      type: object
      required: [id, title, description, severity, status]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        severity: { type: string }
        status: { type: string }
        product_id:
          type: string
          nullable: true
    AgentConsoleView:
      type: object
      required: [autonomy_tier, live_arm, next_action, blocked_markets, imports_loaded, recommended_products, approvals]
      properties:
        autonomy_tier: { type: string }
        live_arm:
          $ref: '#/components/schemas/LiveArmState'
        next_action: { type: string }
        blocked_markets: { type: integer }
        imports_loaded: { type: integer }
        recommended_products:
          type: array
          items: { type: string }
        approvals:
          type: array
          items:
            $ref: '#/components/schemas/AgentApprovalItem'
    ModeResponse:
      type: object
      required: [mode, live_arm]
      properties:
        mode: { type: string }
        live_arm:
          $ref: '#/components/schemas/LiveArmState'
    StrategiesResponse:
      type: object
      required: [mode, live_arm, strategies, imports]
      properties:
        mode: { type: string }
        live_arm:
          $ref: '#/components/schemas/LiveArmState'
        strategies:
          type: array
          items:
            $ref: '#/components/schemas/ProductStrategyConfigView'
        imports:
          type: array
          items:
            $ref: '#/components/schemas/StrategyLabImportSummary'
    ActionResponse:
      type: object
      required: [ok, message]
      properties:
        ok: { type: boolean }
        message: { type: string }
