[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Evan McCall"]

[workspace.dependencies]
alloy = { version = "1.6.3", default-features = false, features = ["signer-local", "signers"] }
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.7", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
jsonwebtoken = "9.3"
parking_lot = "0.12"
polymarket-client-sdk = { version = "0.4.2", features = ["clob"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
dotenvy = "0.15"
uuid = { version = "1.11", features = ["v4", "serde"] }
url = "2.5"
arrow-array = "53"
arrow-schema = "53"
parquet = { version = "53", features = ["arrow"] }
aws-config = "1.8"
aws-sdk-secretsmanager = { version = "1.78", default-features = false, features = ["default-https-client", "rt-tokio"] }
rustls = { version = "0.23", features = ["aws_lc_rs", "ring"] }
p256 = { version = "0.13", features = ["pem", "pkcs8"] }
